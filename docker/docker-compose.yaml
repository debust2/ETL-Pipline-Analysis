services:
  minio:
    image: pgsty/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    command:
      ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
  postgres:
      image: postgres:18
      restart: unless-stopped
      env_file:
        - ../.env
      ports:
        - "5433:5432"
      volumes:
        - pg_data:/var/lib/postgresql
        - ../sql/init:/docker-entrypoint-initdb.d
volumes:
  minio_data:
  pg_data:
  
