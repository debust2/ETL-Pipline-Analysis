services:
  minio:
    image: pgsty/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "my_user_name"
      MINIO_ROOT_PASSWORD: "my_password"
    command:
      ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
  
volumes:
  minio_data: